name: Publish Windows Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows Build run id
        required: true
      tag:
        description: Release tag, e.g. v1.0.0
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh run download "${{ inputs.run_id }}" --repo "${{ github.repository }}" --name Estibordo-Navigator-Windows --dir release

      - name: Verify release files
        run: |
          test -f release/Estibordo-Navigator-Portable.zip
          test -f release/Estibordo-Navigator-Setup.exe
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" release/* \
            --repo "${{ github.repository }}" \
            --title "Estibordo Navigator ${{ inputs.tag }}" \
            --notes "Windows release generated from a successful validated build. Includes installer and portable package."
