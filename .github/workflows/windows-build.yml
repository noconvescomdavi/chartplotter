name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'plugins/**'
      - 'tools/**'
      - 'samples/**'
      - 'docs/**'
      - '.github/workflows/windows-build.yml'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout custom layer
        uses: actions/checkout@v4

      - name: Prepare upstream, branding, layout and NV2 plugin
        shell: pwsh
        run: |
          .\scripts\bootstrap.ps1
          .\scripts\apply-customization.ps1
          .\scripts\apply-layout.ps1
          .\scripts\apply-nv2-plugin.ps1

      - name: Prepare OpenCPN Windows dependencies
        shell: pwsh
        run: |
          .\scripts\prepare-windows-deps.ps1

      - name: Configure
        shell: cmd
        working-directory: workspace\OpenCPN
        run: |
          call cache\wx-config.bat
          if exist build-estibordo rmdir /s /q build-estibordo
          mkdir build-estibordo
          cd build-estibordo
          cmake -A Win32 -G "Visual Studio 17 2022" -DCMAKE_GENERATOR_PLATFORM=Win32 -DCMAKE_BUILD_TYPE=Release -DwxWidgets_LIB_DIR=%wxWidgets_LIB_DIR% -DwxWidgets_ROOT_DIR=%wxWidgets_ROOT_DIR% -DwxWidgets_CONFIGURATION=mswu -DOCPN_TARGET_TUPLE=msvc-wx32;10;x86_64 -DOCPN_CI_BUILD=ON -DOCPN_BUNDLE_WXDLLS=ON -DOCPN_RELEASE=0 -DOCPN_BUILD_TEST=OFF ..

      - name: Build application and NV2 plugin
        shell: cmd
        working-directory: workspace\OpenCPN\build-estibordo
        run: |
          cmake --build . --config Release --parallel

      - name: Build portable package
        shell: cmd
        working-directory: workspace\OpenCPN\build-estibordo
        run: |
          cpack -C Release -G ZIP

      - name: Build NSIS installer
        continue-on-error: true
        shell: cmd
        working-directory: workspace\OpenCPN\build-estibordo
        run: |
          cpack -C Release -G NSIS

      - name: Assemble Estibordo distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $portable = Get-ChildItem workspace\OpenCPN\build-estibordo -Filter "opencpn_*_setup.zip" -File | Select-Object -First 1
          if (-not $portable) { throw "Portable ZIP nao gerado." }
          Expand-Archive $portable.FullName -DestinationPath dist\Estibordo-Navigator-Portable -Force
          Copy-Item scripts\INICIAR-ESTIBORDO.cmd dist\Estibordo-Navigator-Portable\INICIAR-ESTIBORDO.cmd -Force
          New-Item -ItemType Directory -Force -Path dist\Estibordo-Navigator-Portable\tools | Out-Null
          New-Item -ItemType Directory -Force -Path dist\Estibordo-Navigator-Portable\samples | Out-Null
          Copy-Item tools\nmea-simulator.ps1 dist\Estibordo-Navigator-Portable\tools\nmea-simulator.ps1 -Force
          Copy-Item samples\demo-route.gpx dist\Estibordo-Navigator-Portable\samples\demo-route.gpx -Force
          Copy-Item workspace\OpenCPN\ESTIBORDO-NOTICE.txt dist\Estibordo-Navigator-Portable\ESTIBORDO-NOTICE.txt -Force

          $nv2Tools = Get-ChildItem workspace\OpenCPN\build-estibordo -Recurse -File | Where-Object { $_.Name -in @('nv2probe.exe','navsdkprobe.exe','nv2backendprobe.exe') }
          foreach ($tool in $nv2Tools) { Copy-Item $tool.FullName dist\Estibordo-Navigator-Portable\tools\$($tool.Name) -Force }

          $plugin = Get-ChildItem dist\Estibordo-Navigator-Portable -Recurse -Filter "*estibordo_nv2_pi*.dll" -File | Select-Object -First 1
          if (-not $plugin) { throw "Estibordo NV2 plugin ausente no pacote portatil." }

          $installer = Get-ChildItem workspace\OpenCPN\build-estibordo -Filter "*.exe" -File | Where-Object { $_.Name -match 'setup|Setup' } | Select-Object -First 1
          if ($installer) { Copy-Item $installer.FullName dist\Estibordo-Navigator-Setup.exe -Force }
          Compress-Archive -Path dist\Estibordo-Navigator-Portable\* -DestinationPath dist\Estibordo-Navigator-Portable.zip -Force

      - name: Runtime smoke test
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\Estibordo-Navigator-Portable -Recurse -Filter opencpn.exe -File | Select-Object -First 1
          if (-not $exe) { throw "opencpn.exe ausente no pacote final." }
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exe.FullName
          $psi.Arguments = "--help"
          $psi.WorkingDirectory = $exe.DirectoryName
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $p = New-Object System.Diagnostics.Process
          $p.StartInfo = $psi
          [void]$p.Start()
          if (-not $p.WaitForExit(20000)) { $p.Kill(); throw "Runtime timeout." }
          $out = $p.StandardOutput.ReadToEnd()
          Write-Host $out
          if ($out -notmatch "rebuild_chart_db" -or $out -notmatch "parse_all_enc" -or $out -notmatch "GPX") {
            throw "Smoke test de cartas/ENC/GPX falhou."
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Estibordo-Navigator-Windows
          if-no-files-found: error
          path: |
            dist/Estibordo-Navigator-Portable.zip
            dist/Estibordo-Navigator-Setup.exe
