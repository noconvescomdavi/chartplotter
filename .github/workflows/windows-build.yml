name: Windows x64 Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/windows-build.yml'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout custom layer
        uses: actions/checkout@v4

      - name: Prepare upstream
        shell: pwsh
        run: |
          .\scripts\bootstrap.ps1
          .\scripts\apply-customization.ps1

      - name: Configure
        shell: pwsh
        run: |
          cmake -S workspace/OpenCPN -B workspace/OpenCPN/build-estibordo -G "Visual Studio 17 2022" -A x64 -DOCPN_USE_GL=ON -DOCPN_BUILD_TEST=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build workspace/OpenCPN/build-estibordo --config Release --parallel

      - name: Package build directory
        if: success()
        shell: pwsh
        run: |
          Compress-Archive -Path workspace/OpenCPN/build-estibordo/* -DestinationPath Estibordo-Navigator-Windows-x64.zip -Force

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Estibordo-Navigator-Windows-x64
          path: Estibordo-Navigator-Windows-x64.zip
