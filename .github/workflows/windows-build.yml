name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/windows-build.yml'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout custom layer
        uses: actions/checkout@v4

      - name: Prepare upstream and branding
        shell: pwsh
        run: |
          .\scripts\bootstrap.ps1
          .\scripts\apply-customization.ps1

      - name: Install OpenCPN Windows dependencies
        shell: cmd
        working-directory: workspace\OpenCPN
        run: |
          call buildwin\win_deps.bat wx32

      - name: Configure
        shell: cmd
        working-directory: workspace\OpenCPN
        run: |
          call cache\wx-config.bat
          set "PATH=%PATH%;%PROGRAMFILES%\Poedit\Gettexttools\bin;%PROGRAMFILES(X86)%\Poedit\Gettexttools\bin"
          where msgmerge
          where msgfmt
          if exist build-estibordo rmdir /s /q build-estibordo
          mkdir build-estibordo
          cd build-estibordo
          cmake -A Win32 -G "Visual Studio 17 2022" -DCMAKE_GENERATOR_PLATFORM=Win32 -DCMAKE_BUILD_TYPE=Release -DwxWidgets_LIB_DIR=%wxWidgets_LIB_DIR% -DwxWidgets_ROOT_DIR=%wxWidgets_ROOT_DIR% -DwxWidgets_CONFIGURATION=mswu -DOCPN_TARGET_TUPLE=msvc-wx32;10;x86_64 -DOCPN_CI_BUILD=ON -DOCPN_BUNDLE_WXDLLS=ON -DOCPN_RELEASE=0 -DOCPN_BUILD_TEST=OFF ..

      - name: Build installer
        shell: cmd
        working-directory: workspace\OpenCPN\build-estibordo
        run: |
          cmake --build . --target package --config Release

      - name: Collect distributables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem -Path workspace\OpenCPN\build-estibordo -Recurse -File |
            Where-Object { $_.Extension -in '.exe','.msi','.zip' } |
            Copy-Item -Destination dist -Force
          Copy-Item workspace\OpenCPN\ESTIBORDO-NOTICE.txt dist -Force
          Compress-Archive -Path dist\* -DestinationPath Estibordo-Navigator-Windows.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Estibordo-Navigator-Windows
          path: |
            Estibordo-Navigator-Windows.zip
            dist/**
